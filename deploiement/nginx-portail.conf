# =============================================================================
#  PORTAIL CHERCHEUR — port 443, seule entrée publique de l'enclave
#
#  Nginx ne sert aucun fichier : il termine le TLS et répartit entre deux
#  destinations.
#    /guacamole/  → Guacamole, où la session RDP s'affiche
#    /            → le conteneur du portail : interface ET API
# =============================================================================
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/enclave.crt;
    ssl_certificate_key /etc/nginx/certs/enclave.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # --- Guacamole : c'est ici que la session s'affiche ---
    # Déclaré en premier : ce chemin ne doit pas tomber dans le portail.
    location /guacamole/ {
        proxy_pass http://127.0.0.1:8080/guacamole/;
        proxy_buffering off;

        # WebSocket : le flux de la session passe par là. Sans la traduction
        # de l'en-tête Connection, l'affichage ne s'ouvre pas.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Une session peut rester ouverte longtemps sans trafic.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        access_log off;     # Guacamole journalise déjà les connexions
    }

    # --- Portail : interface et API, depuis le conteneur ---
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # L'ouverture d'une session prend environ deux minutes.
        proxy_read_timeout 300s;
    }

    # Les routes internes vivent hors du chemin public : elles ne doivent
    # JAMAIS être atteignables depuis le web.
    location /interne/ { deny all; }
}
